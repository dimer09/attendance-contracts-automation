[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bpa"
version = "0.1.0"
description = "Reconcile client timesheets with employee contracts"
requires-python = ">=3.11"

dependencies = [
    "pydantic",
    "pandas",
    "openpyxl",
    "requests",
    "python-dotenv",
]

[project.scripts]
bpa = "bpa.cli:main" 

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]   
markers = [
    "e2e: end-to-end tests (real server and real process, slower); skip with -m 'not e2e'",
]

[tool.coverage.run]
branch = true 

[tool.coverage.report]
show_missing = true  
fail_under = 70  


[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "."]   

[tool.ruff.lint]
select = [
    "E", 
    "F", 
    "I", 
    "B",  
    "S",  
]
ignore = ["E501"]  

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"] 