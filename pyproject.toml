[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bpa"
version = "0.1.0"
description = "Reconcile client timesheets with employee contracts"
requires-python = ">=3.11"

dependencies = [
    "pydantic",
    "pandas",
    "openpyxl",
    "requests",
    "python-dotenv",
]

[project.scripts]
bpa = "bpa.cli:main" 

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]   

[tool.coverage.report]
show_missing = true  
fail_under = 70  